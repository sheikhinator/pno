[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pno"
version = "1.0.2"
description = "PNO: People & Performance for MAF Carrefour Pakistan (offline Windows desktop app)"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "python-calamine>=0.2",
  "openpyxl>=3.1",
  "xlsxwriter>=3.1",
  "reportlab>=4.0",
  "python-pptx>=0.6.23",
]

[project.scripts]
pno = "pno.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pno = ["web/*", "assets/*", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
