[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pno-desktop"
version = "0.1.0"
description = "Offline HR and operations analytics desktop application"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "openpyxl>=3.1.5,<4",
  "xlrd>=2.0.1,<3",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
local-ai = ["llama-cpp-python>=0.3,<0.4"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
pno = "pno.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pno*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
