name: Build PNO for Windows

on:
  push:
    branches: [main, "ccr-*"]
  workflow_dispatch:
    inputs:
      include_model:
        description: "Also attach the offline AI model (1.9 GB) to the release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Unit and integration tests
        run: python -m pytest -q

      - name: Offline AI runtime (llama.cpp, CPU build)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "pno-build" }
          $rels = Invoke-RestMethod -Headers $h -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30"
          $bad = "cuda|cudart|vulkan|hip|rocm|radeon|sycl|opencl|kompute|arm64|aarch64|openvino|npu|xcframework"
          $rel = $null; $asset = $null
          foreach ($r in ($rels | Where-Object { -not $_.draft })) {
            $zips = $r.assets | Where-Object { $_.name -match "\.zip$" }
            $asset = $zips | Where-Object { $_.name -match "bin-win-cpu-x64\.zip$" } | Select-Object -First 1
            if (-not $asset) {
              $asset = $zips | Where-Object { $_.name -match "win" -and $_.name -match "x64|amd64" -and $_.name -notmatch $bad } |
                       Sort-Object { if ($_.name -match "cpu") { 0 } else { 1 } } | Select-Object -First 1
            }
            if ($asset) { $rel = $r; break }
            Write-Host "llama.cpp $($r.tag_name): no Windows CPU zip among: $(($r.assets | ForEach-Object name) -join ', ')"
          }
          if (-not $asset) { throw "No Windows CPU build found in the last 30 llama.cpp releases" }
          Write-Host "llama.cpp $($rel.tag_name): $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile llama.zip
          New-Item -ItemType Directory -Force packaging/runtime/llama | Out-Null
          Expand-Archive llama.zip -DestinationPath packaging/runtime/llama -Force
          $srv = Get-ChildItem packaging/runtime/llama -Recurse -Filter llama-server.exe | Select-Object -First 1
          if (-not $srv) { throw "llama-server.exe missing from $($asset.name)" }
          # keep only what the server needs
          Get-ChildItem packaging/runtime/llama -Recurse -File |
            Where-Object { $_.Extension -eq ".exe" -and $_.Name -ne "llama-server.exe" } | Remove-Item
          "$($rel.tag_name)" | Out-File packaging/runtime/llama/VERSION.txt

      - name: Build PNO.exe
        run: pyinstaller packaging/pno.spec --noconfirm --distpath dist --workpath build

      - name: Self-test the built app (every screen, imports, exports, assistant)
        shell: pwsh
        run: |
          # a real Windows window first; the hidden (offscreen) mode only if the runner has no usable desktop
          $env:QT_QPA_PLATFORM = "windows"
          $p = Start-Process dist/PNO/PNO.exe -ArgumentList "--selftest", "$PWD/selftest.log" -Wait -PassThru
          Get-Content selftest.log
          if ($p.ExitCode -ne 0) {
            Write-Host "::warning::Self-test in a normal window failed ($($p.ExitCode)); trying offscreen"
            $env:QT_QPA_PLATFORM = "offscreen"
            $p = Start-Process dist/PNO/PNO.exe -ArgumentList "--selftest", "$PWD/selftest.log" -Wait -PassThru
            Get-Content selftest.log
            if ($p.ExitCode -ne 0) { throw "Self-test failed ($($p.ExitCode))" }
          }

      - name: Small test model for the offline AI check
        uses: actions/cache@v4
        with:
          path: test-model.gguf
          key: qwen2.5-0.5b-instruct-q4km

      - name: Offline AI check (bundled llama-server answers)
        shell: pwsh
        run: |
          if (-not (Test-Path test-model.gguf)) {
            Invoke-WebRequest -Uri "https://huggingface.co/bartowski/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/Qwen2.5-0.5B-Instruct-Q4_K_M.gguf?download=true" -OutFile test-model.gguf
          }
          $p = Start-Process dist/PNO/PNO.exe -ArgumentList "--offline-check", "$PWD/test-model.gguf", "$PWD/offline.log" -Wait -PassThru
          Get-Content offline.log
          if ($p.ExitCode -ne 0) { throw "Offline AI check failed ($($p.ExitCode))" }

      - name: Package (portable zip + installer)
        shell: pwsh
        run: |
          $v = (python -c "import sys; sys.path.insert(0,'src'); import pno; print(pno.__version__)").Trim()
          Compress-Archive -Path dist/PNO -DestinationPath "dist/PNO-$v-portable-win64.zip" -CompressionLevel Optimal
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$v" "/DSourceDir=$PWD\dist\PNO" packaging/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer build failed" }
          Get-ChildItem dist -File | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: PNO-Windows
          path: |
            dist/PNO-Setup-*.exe
            dist/PNO-*-portable-win64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Offline AI model for the release
        if: github.event_name == 'workflow_dispatch' && inputs.include_model
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://huggingface.co/bartowski/Qwen2.5-3B-Instruct-GGUF/resolve/main/Qwen2.5-3B-Instruct-Q4_K_M.gguf?download=true" -OutFile dist/Qwen2.5-3B-Instruct-Q4_K_M.gguf

      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION-build.${{ github.run_number }}"
          $files = @(Get-ChildItem dist/PNO-Setup-*.exe, dist/PNO-*-portable-win64.zip, dist/SHA256SUMS.txt, dist/*.gguf -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          $notes = @"
          PNO $env:VERSION for Windows 10/11 (64-bit).

          - **PNO-Setup-$env:VERSION.exe**: installer (no administrator rights needed).
          - **PNO-$env:VERSION-portable-win64.zip**: unzip and run PNO.exe.

          All data stays on the PC (%LOCALAPPDATA%\PNO). Built and self-tested by GitHub Actions from commit ${{ github.sha }}.
          The app is not code-signed: Windows SmartScreen may ask you to confirm (More info → Run anyway).
          "@
          gh release create $tag @files --target "${{ github.sha }}" --title "PNO $env:VERSION (build ${{ github.run_number }})" --notes $notes --prerelease
